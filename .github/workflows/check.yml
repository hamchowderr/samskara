name: check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the floor in package.json engines (>= 22.19.0), which is
          # itself above @mastra/mcp-docs-server's >= 22.13.0.
          node-version: '22.19.0'
          cache: npm

      # `npm ci` installs from the lockfile and fails if the two have drifted,
      # which is the check worth having here.
      - run: npm ci

      - run: npm run check

      # Samskara passes @mastra/auth-better-auth its own betterAuth() instance,
      # which makes the provider's init() return early — so its config is ours
      # to mirror. This fails when that function changes upstream.
      - run: npm run check:auth-parity

      # Tier-1 tests: no network, no server. Auth tests use a real temp libSQL
      # file; only the Resend HTTP call is mocked.
      - run: npm test

  # The invite flow in a real browser against the real dev server, on its own
  # port and a throwaway database (playwright.config.ts). Separate job so the
  # fast checks above report without waiting for a browser.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
